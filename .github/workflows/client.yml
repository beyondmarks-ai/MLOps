name: Client installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*client*'
      - 'deploy/**'
      - 'docker/**'
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/client.yml'
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell syntax, credentials and resume checks
        shell: powershell
        run: ./scripts/test-client.ps1
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.runtime
          load: true
          tags: mlops-client-runtime:local
          cache-from: type=gha,scope=client-runtime
          cache-to: type=gha,scope=client-runtime,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.orchestrator
          load: true
          tags: mlops-client-airflow:local
          cache-from: type=gha,scope=client-airflow
          cache-to: type=gha,scope=client-airflow,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic==2.7.1
      - name: Fresh install, authentication, training, prediction and resume
        run: python -m scripts.check_client_stack
