name: Deploy to Azure VM
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check src/ dags/ tests/ && ruff format --check src/ dags/ tests/
      - run: pytest tests/ --cov=src --cov-fail-under=80
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy reviewed public commit
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/deploy.sh <<EOF
          set -eu
          cd /opt/churn-mlops
          curl --fail --location --proto '=https' 'https://github.com/$REPOSITORY/archive/$COMMIT.tar.gz' -o /tmp/churn-release.tar.gz
          tar -xzf /tmp/churn-release.tar.gz --strip-components=1 -C /opt/churn-mlops
          docker compose --env-file .env -f deploy/compose.azure.yml build
          docker compose --env-file .env -f deploy/compose.azure.yml up -d --wait --wait-timeout 240
          EOF
          az vm run-command invoke --resource-group rg-churn-mlops --name churn-mlops-vm --command-id RunShellScript --scripts @/tmp/deploy.sh --query 'value[].message' -o tsv
