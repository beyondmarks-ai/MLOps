# Requires Docker Compose 2.24.4+ for port replacement (never expose the Azure ports).
services:
  mysql:
    environment:
      MYSQL_DATABASE: churn_client
  init:
    image: mlops-client-airflow:local
  mlflow:
    image: mlops-client-runtime:local
    ports: ["127.0.0.1:${MLFLOW_PORT}:5000"]
  api:
    image: mlops-client-runtime:local
  api2:
    image: mlops-client-runtime:local
  scheduler:
    image: mlops-client-airflow:local
  airflow:
    image: mlops-client-airflow:local
    ports: !override ["127.0.0.1:${AIRFLOW_PORT}:8080"]
  caddy:
    environment:
      APP_HOST: ":80"
    ports: !override ["127.0.0.1:${APP_PORT}:80"]
  client-setup:
    profiles: [setup]
    image: mlops-client-airflow:local
    restart: "no"
    entrypoint: [python, -m, scripts.bootstrap_client]
    volumes:
      - ../scripts:/app/scripts:ro
      - app-data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME}
      HPO_TRIALS: "3"
      HPO_TIMEOUT: "90"
      MIN_MODEL_AUC: "0.55"
      CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
